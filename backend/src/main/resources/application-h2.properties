# Standalone / H2 embedded execution profile for instant testing & demo
spring.datasource.url=jdbc:h2:file:./data/hotel_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

hotel.app.jwtSecret=9a4f2c8d7e1b5a3f6c8d9e0b1a2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0
hotel.app.jwtExpirationMs=86400000
hotel.app.taxPercentage=10.0
hotel.app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
