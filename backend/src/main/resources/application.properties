# ===================================================================
# Hotel Booking and Management System - Application Configuration
# ===================================================================

spring.application.name=Hotel Booking System
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_booking_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
hotel.app.jwtSecret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c8d9e0b1a2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0}
hotel.app.jwtExpirationMs=86400000

# Hotel Booking Policy Configuration
hotel.app.taxPercentage=10.0

# CORS Configuration
hotel.app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
